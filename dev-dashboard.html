<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TapTrivia Dev Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; font-family: Outfit, sans-serif; height: 100vh; display: flex; flex-direction: column; }
  header { background: #16213e; padding: 8px 20px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid #333; }
  header h1 { color: #00d4aa; font-size: 16px; font-weight: 600; }
  header span { color: #888; font-size: 13px; }
  .panels { display: flex; flex: 1; gap: 4px; padding: 4px; overflow: hidden; }
  .panel { flex: 1; display: flex; flex-direction: column; background: #0f0f1a; border-radius: 8px; overflow: hidden; }
  .panel.tv { flex: 1.5; }
  .panel-header { background: #16213e; padding: 6px 14px; display: flex; align-items: center; justify-content: space-between; }
  .panel-header h2 { color: #fff; font-size: 13px; font-weight: 500; }
  .panel-header a { color: #667eea; font-size: 12px; text-decoration: none; }
  .panel-header a:hover { text-decoration: underline; }
  iframe { flex: 1; border: none; background: #000; }
  .phone-frame { flex: 1; display: flex; justify-content: center; align-items: center; background: #0a0a14; }
  .phone-frame iframe { width: 390px; height: 100%; max-height: 844px; border-radius: 20px; border: 2px solid #333; }
</style>
</head>
<body>
  <header>
    <h1>TapTrivia Dev Dashboard</h1>
    <span>Player :8091 &nbsp;|&nbsp; TV :8090</span>
  </header>
  <div class="panels">
    <div class="panel">
      <div class="panel-header">
        <h2>Player App (Mobile)</h2>
        <a href="http://localhost:8091" target="_blank">Open &rarr;</a>
      </div>
      <div class="phone-frame">
        <iframe src="http://localhost:8091"></iframe>
      </div>
    </div>
    <div class="panel tv">
      <div class="panel-header">
        <h2>TV App (1920x1080)</h2>
        <a href="http://localhost:8090" target="_blank">Open &rarr;</a>
      </div>
      <iframe src="http://localhost:8090"></iframe>
    </div>
  </div>
</body>
</html>
