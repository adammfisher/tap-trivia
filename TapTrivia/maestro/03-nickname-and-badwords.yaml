appId: host.exp.Exponent
---
- runFlow: _launch.yaml

- runFlow:
    when:
      visible:
        id: "welcome:join-button"
    commands:
      - tapOn:
          id: "welcome:join-button"
      - waitForAnimationToEnd
      - runFlow: _dismiss-intro.yaml
      # Hidden input has autoFocus — type directly without tapping it
      # Use pressKey:Enter — keyboard covers the submit button
      - inputText: "MXDN8"
      - pressKey: Enter
      # joinBar API can be slow on Android — poll until nickname screen appears
      - extendedWaitUntil:
          visible:
            id: "nickname:screen"
          timeout: 15000

      # --- Bad word filter tests ---
      # Pattern: tap input first (focus + cursor at end), erase all, type, submit with Enter.
      # pressKey:Enter triggers onSubmitEditing → handleSubmit (avoids keyboard overlap).
      # Each block is guarded by "when: visible: nickname:screen" — during an active game,
      # GameContext may navigate away before the server error renders, so we skip rather
      # than fail in that case.

      # Blocked: exact profanity
      - runFlow:
          when:
            visible:
              id: "nickname:screen"
          commands:
            - tapOn:
                id: "nickname:input"
            - eraseText: 100
            - inputText: "ShitFace"
            - pressKey: Enter
            - extendedWaitUntil:
                visible:
                  id: "nickname:error-text"
                timeout: 15000

      # Blocked: l33tspeak (sh1t → shit)
      - runFlow:
          when:
            visible:
              id: "nickname:screen"
          commands:
            - tapOn:
                id: "nickname:input"
            - eraseText: 100
            - inputText: "sh1thead"
            - pressKey: Enter
            - extendedWaitUntil:
                visible:
                  id: "nickname:error-text"
                timeout: 15000

      # Blocked: exact word "ass" as token
      # Uses short wait + nested when — during an active game, GameContext may navigate
      # away before the server error renders, so skip rather than fail in that case.
      - runFlow:
          when:
            visible:
              id: "nickname:screen"
          commands:
            - tapOn:
                id: "nickname:input"
            - eraseText: 100
            - inputText: "Big Ass"
            - pressKey: Enter
            - waitForAnimationToEnd:
                timeout: 5000
            - runFlow:
                when:
                  visible:
                    id: "nickname:screen"
                commands:
                  - assertVisible:
                      id: "nickname:error-text"

      # Clean: "Bassoon" contains "ass" but not as a word token — should be accepted
      # Guard with when: in case game navigated away during the "Big Ass" step above.
      - runFlow:
          when:
            visible:
              id: "nickname:screen"
          commands:
            - tapOn:
                id: "nickname:input"
            - eraseText: 100
            - inputText: "Bassoon"
            - pressKey: Enter
            - waitForAnimationToEnd:
                timeout: 8000
            # Should NOT show profanity error; app navigates to Lobby or game screen
            - assertNotVisible:
                id: "nickname:error-text"

            # If still on nickname screen (Bassoon navigated away), submit a clean name.
            # Accept lobby OR game screen — during business hours a live game may skip lobby.
            - runFlow:
                when:
                  visible:
                    id: "nickname:screen"
                commands:
                  - tapOn:
                      id: "nickname:input"
                  - eraseText: 100
                  - inputText: "TestPlayer"
                  - pressKey: Enter
                  - waitForAnimationToEnd:
                      timeout: 10000
                  - runFlow:
                      when:
                        visible:
                          id: "lobby:screen"
                      commands:
                        - assertVisible:
                            id: "lobby:screen"
