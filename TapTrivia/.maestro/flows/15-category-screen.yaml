appId: com.visudolabs.taptrivia.app
name: Category screen — "Get ready!" appears at question start and auto-advances
---
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: "Join a Game.*"
- waitForAnimationToEnd:
    timeout: 5000
- inputText: "9CK6T"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 12000
- inputText: "CatBot"
- pressKey: Enter

# Wait for game to start — lobby → category (up to 90s)
- waitForAnimationToEnd:
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 30000

# Either on category or already on playing screen
- runFlow:
    when:
      visible: "Get ready!"
    commands:
      - assertVisible: "Get ready!"
      # Category auto-advances within 3s
      - waitForAnimationToEnd:
          timeout: 6000
      - assertNotVisible: "Get ready!"
