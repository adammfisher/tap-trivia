appId: com.visudolabs.taptrivia.app
name: Tapping an answer navigates to LockedIn screen with "Waiting for reveal"
---
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: "Join a Game.*"
- waitForAnimationToEnd:
    timeout: 5000
- inputText: "9CK6T"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 12000
- inputText: "LockBot"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 8000

- extendedWaitUntil:
    visible:
      text: "Get ready!"
    timeout: 120000
- waitForAnimationToEnd:
    timeout: 6000
- waitForAnimationToEnd:
    timeout: 5000

# Confirm question is loaded (TOTAL visible = playing screen with question data)
- extendedWaitUntil:
    visible:
      text: "TOTAL"
    timeout: 10000

- tapOn:
    text: "A"

- extendedWaitUntil:
    visible:
      text: "Locked In!"
    timeout: 10000
- assertVisible: "Waiting for reveal"
