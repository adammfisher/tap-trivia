<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TapTrivia — TV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Fredoka:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>var _v = Date.now();</script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
</head>
<body>
  <!-- Persistent background layer: gradient + animated orbs -->
  <div id="tt-bg" class="tt-bg" aria-hidden="true">
    <div class="tt-orb tt-orb--blue"></div>
    <div class="tt-orb tt-orb--red"></div>
    <div class="tt-orb tt-orb--green"></div>
  </div>

  <!-- Single screen container — JS swaps content here -->
  <main id="tt-screen" class="tt-screen" role="main" aria-live="polite"></main>

  <!-- Error/reconnecting overlay (shown on top of current screen) -->
  <div id="tt-error-overlay" class="tt-error-overlay tt-hidden" role="alert" aria-label="Connection status">
    <div class="tt-error-overlay__content">
      <div class="tt-error-overlay__spinner"></div>
      <div class="tt-error-overlay__text">Reconnecting...</div>
    </div>
  </div>

  <script>
    (function() {
      // Detect low-end TV WebView wrappers (Fire TV Stick, Vega) — drop expensive
      // CSS (animated orbs, backdrop blur) to avoid tile-memory exhaustion + GPU
      // context loss. The page is already 1920×1080 on these devices, so the
      // body-scale is also unnecessary work.
      var params = new URLSearchParams(window.location.search);
      var platform = params.get('platform') || '';
      var isLowPowerTv = platform === 'firestickclassic' || platform === 'firestickvega';
      if (isLowPowerTv) {
        document.documentElement.classList.add('tt-low-power');
      }

      function scaleToFit() {
        // Layout is 1920×1080, visual viewport may be smaller (Fire TV is 960
        // due to DPR=2). Scale from top-left so the page lines up with viewport.
        var sx = window.innerWidth / 1920;
        var sy = window.innerHeight / 1080;
        document.body.style.transformOrigin = '0 0';
        document.body.style.transform = 'scale(' + sx + ',' + sy + ')';
      }
      scaleToFit();
      window.addEventListener('resize', scaleToFit);

      // Dynamic cache buster — load CSS + JS with timestamp
      var v = _v;
      var css = document.createElement('link');
      css.rel = 'stylesheet';
      css.href = 'css/styles.css?v=' + v;
      document.head.appendChild(css);

      var scripts = ['js/config.js','js/scoring.js','js/game-clock.js','js/api.js','js/app.js'];
      (function loadNext(i) {
        if (i >= scripts.length) return;
        var s = document.createElement('script');
        s.src = scripts[i] + '?v=' + v;
        s.onload = function() { loadNext(i + 1); };
        document.body.appendChild(s);
      })(0);

    })();
  </script>
</body>
</html>
