<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get TapTrivia</title>
  <meta name="description" content="Download TapTrivia — live bar trivia on your phone.">
  <meta property="og:title" content="Get TapTrivia">
  <meta property="og:description" content="Live bar trivia on your phone. Download now.">
  <meta property="og:url" content="https://app.taptrivia.tv">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(150deg, #0f0326, #1e0f4a, #3d1866, #6b2358, #a8334a);
      color: #fff;
      text-align: center;
      padding: 24px;
    }
    .container { max-width: 400px; width: 100%; }
    .logo { font-size: 48px; margin-bottom: 8px; }
    h1 { font-size: 28px; font-weight: 800; margin-bottom: 4px; }
    .tagline { font-size: 15px; color: rgba(255,255,255,0.5); margin-bottom: 32px; }
    .btn {
      display: block;
      width: 100%;
      padding: 16px 24px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 12px;
      transition: opacity 0.15s;
    }
    .btn:active { opacity: 0.85; }
    .btn-ios { background: #fff; color: #0f0326; }
    .btn-android { background: #00d4aa; color: #0f0326; }
    .btn-web { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.15); }
    .btn-sub { font-size: 12px; font-weight: 400; opacity: 0.6; display: block; margin-top: 2px; }
    .footer { margin-top: 32px; font-size: 11px; color: rgba(255,255,255,0.2); }
    .footer a { color: rgba(255,255,255,0.3); }
    .redirecting { display: none; font-size: 14px; color: rgba(255,255,255,0.6); margin-top: 16px; }
  </style>
  <script>
    // App store URLs — replace with real URLs when available
    const STORE_URLS = {
      ios: null,     // e.g. 'https://apps.apple.com/app/taptrivia/id1234567890'
      android: null, // e.g. 'https://play.google.com/store/apps/details?id=tv.taptrivia.mobile'
      web: 'https://play.taptrivia.tv'
    };

    function detectPlatform() {
      const ua = navigator.userAgent || '';
      if (/iPhone|iPad|iPod/i.test(ua)) return 'ios';
      if (/Android/i.test(ua)) return 'android';
      return 'web';
    }

    function redirect() {
      const platform = detectPlatform();
      const url = STORE_URLS[platform];
      if (url) {
        document.getElementById('redirecting').style.display = 'block';
        window.location.href = url;
      }
      // If no URL set yet, stay on page and show buttons
    }

    // Auto-redirect on mobile if store URLs are configured
    document.addEventListener('DOMContentLoaded', redirect);
  </script>
</head>
<body>
  <div class="container">
    <div class="logo">&#x1F4A1;</div>
    <h1>TapTrivia</h1>
    <p class="tagline">Live bar trivia on your phone</p>

    <a id="btn-ios" class="btn btn-ios" href="#" onclick="return false;">
      Download for iPhone
      <span class="btn-sub">App Store</span>
    </a>
    <a id="btn-android" class="btn btn-android" href="#" onclick="return false;">
      Download for Android
      <span class="btn-sub">Google Play</span>
    </a>
    <a class="btn btn-web" href="https://play.taptrivia.tv">
      Play in Browser
      <span class="btn-sub">No download required</span>
    </a>

    <p id="redirecting" class="redirecting">Redirecting to your app store...</p>

    <div class="footer">
      <a href="https://taptrivia.tv">taptrivia.tv</a>
    </div>
  </div>

  <script>
    // Wire up buttons with store URLs (or disable if not set yet)
    const iosBtn = document.getElementById('btn-ios');
    const androidBtn = document.getElementById('btn-android');
    if (STORE_URLS.ios) {
      iosBtn.href = STORE_URLS.ios;
      iosBtn.onclick = null;
    } else {
      iosBtn.style.opacity = '0.4';
      iosBtn.style.pointerEvents = 'none';
      iosBtn.querySelector('.btn-sub').textContent = 'Coming soon';
    }
    if (STORE_URLS.android) {
      androidBtn.href = STORE_URLS.android;
      androidBtn.onclick = null;
    } else {
      androidBtn.style.opacity = '0.4';
      androidBtn.style.pointerEvents = 'none';
      androidBtn.querySelector('.btn-sub').textContent = 'Coming soon';
    }
  </script>
</body>
</html>
